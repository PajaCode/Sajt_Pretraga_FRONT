<div class="gm-page gm-profile-page">
  <h2 class="gm-section-title">Profil</h2>

  <ng-container *ngIf="skeleton; else profileContent">
    <div class="gm-profile-card">
      <div class="gm-skeleton-line" *ngFor="let i of [1,2,3,4,5]" style="margin-bottom: 14px;"></div>
    </div>
  </ng-container>

  <ng-template #profileContent>
    <form [formGroup]="osnovniPodaciForm">
      <div class="gm-profile-card">
        <div class="gm-profile-card-header">
          <h3><i class="pi pi-user"></i>&nbsp;Lični podaci</h3>
        </div>
        <div class="gm-profile-grid">
          <div class="gm-field">
            <label for="ime">Ime</label>
            <input type="text" pInputText id="ime" formControlName="ime" (keyup.enter)="updateUser()" />
          </div>
          <div class="gm-field">
            <label for="prezime">Prezime</label>
            <input type="text" pInputText id="prezime" formControlName="prezime" (keyup.enter)="updateUser()" />
          </div>
        </div>
      </div>

      <div class="gm-profile-card">
        <div class="gm-profile-card-header">
          <h3><i class="pi pi-envelope"></i>&nbsp;Kontakt</h3>
        </div>
        <div class="gm-profile-grid">
          <div class="gm-field gm-field-readonly">
            <label for="email">Email <span class="gm-badge gm-badge-neutral">read-only</span></label>
            <input type="email" pInputText id="email" formControlName="email" readonly />
          </div>
          <div class="gm-field">
            <label for="brTelefona">Broj telefona</label>
            <p-inputMask mask="+381 69-999/999?9" id="brTelefona" formControlName="brTelefona"
              (keyup.enter)="updateUser()"></p-inputMask>
          </div>
        </div>
      </div>

      <div class="gm-profile-card">
        <div class="gm-profile-card-header">
          <h3><i class="pi pi-id-card"></i>&nbsp;Identifikacija</h3>
          <span class="gm-badge" [ngClass]="accountStatusBadgeClass">Status naloga: {{accountStatusLabel}}</span>
        </div>
        <div class="gm-profile-grid">
          <div class="gm-field gm-field-readonly">
            <label for="username">Username <span class="gm-badge gm-badge-neutral">read-only</span></label>
            <input type="text" pInputText id="username" formControlName="username" readonly />
          </div>
          <div class="gm-field">
            <label for="jmbg">
              Matični broj (JMBG)
              <span class="gm-badge gm-badge-neutral" *ngIf="osnovniPodaciForm.controls['jmbg'].disabled">read-only</span>
            </label>
            <input type="text" pInputText id="jmbg" maxlength="13" formControlName="jmbg" />
            <small class="gm-field-error"
              *ngIf="osnovniPodaciForm.controls['jmbg'].dirty && osnovniPodaciForm.controls['jmbg'].hasError('jmbg')">
              JMBG nije ispravan.
            </small>
          </div>
          <div class="gm-field gm-field-readonly">
            <label for="datumRodjenja">Datum rođenja <span class="gm-badge gm-badge-neutral">read-only</span></label>
            <input type="text" pInputText id="datumRodjenja" readonly
              [value]="osnovniPodaciForm.controls['datumRodjenja'].value | date:'dd.MM.yyyy'" />
          </div>
        </div>
      </div>

      <div class="gm-profile-actions">
        <button pButton type="button" label="Sačuvaj promene" icon="pi pi-check" [loading]="loadingUpdateUser"
          [disabled]="!osnovniPodaciForm.valid" (click)="updateUser()"></button>
      </div>
    </form>

    <form [formGroup]="resetPassForm">
      <div class="gm-profile-card">
        <div class="gm-profile-card-header">
          <h3><i class="pi pi-lock"></i>&nbsp;Bezbednost / Promena lozinke</h3>
        </div>
        <div class="gm-profile-grid">
          <div class="gm-field">
            <label for="oldPassword">Stara lozinka</label>
            <p-password formControlName="oldPassword" id="oldPassword" placeholder="Unesite staru lozinku"
              [toggleMask]="true" [feedback]="false"></p-password>
          </div>
          <div class="gm-field">
            <label for="newPassword">Nova lozinka</label>
            <p-password formControlName="newPassword" id="newPassword" [toggleMask]="true"
              (keyup.enter)="resetPassword()" placeholder="Unesite novu lozinku" [promptLabel]="'Veoma slaba'"
              [weakLabel]="'Slaba'" [mediumLabel]="'Srednja'" [strongLabel]="'Jaka'">
              <ng-template pTemplate="footer">
                <p-divider></p-divider>
                <p class="mt-2">Sugestije</p>
                <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5; text-align: left;">
                  <li>{{passwordPolicyHint}}</li>
                </ul>
              </ng-template>
            </p-password>
          </div>
        </div>
      </div>

      <div class="gm-profile-actions">
        <button pButton type="button" label="Sačuvaj novu lozinku" icon="pi pi-refresh" [loading]="loadingResetPass"
          [disabled]="!resetPassForm.valid" (click)="resetPassword()"></button>
      </div>
    </form>
  </ng-template>
</div>
