<div class="row">
  <p-card>
    <ng-template pTemplate="header">
      <img alt="Globos osiguranje" src="https://globos.rs/images/logo_194x58.svg" />
    </ng-template>
    <ng-template pTemplate="body">
      <hr style="margin: 0 0 1.5rem 0;">
      <form [formGroup]="form">
        <!-- <div class="row">
          <div class="flex flex-column">
            <span class="p-float-label">
              <p-password formControlName="oldPassword" id="oldPassword" [toggleMask]="true" [feedback]="false"
                placeholder="Unesite staru lozinku"></p-password>
              <label for="oldPassword">Stara lozinka</label>
            </span>
          </div>
        </div> -->
        <div class="row">
          <div class="flex flex-column">
            <span class="p-float-label">
              <p-password formControlName="newPassword" id="newPassword" [toggleMask]="true" (keyup.enter)="potvrdi()"
                [promptLabel]="'Veoma slaba'" [weakLabel]="'Slaba'" [mediumLabel]="'Srednja'" [strongLabel]="'Jaka'"
                placeholder="Unesite novu lozinku">
                <ng-template pTemplate="footer">
                  <p-divider></p-divider>
                  <p class="mt-2">Sugestije</p>
                  <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5">
                    <li>Barem jedno malo slovo</li>
                    <li>Barem jedno veliko slovo</li>
                    <li>Barem jedan broj</li>
                    <li>Minimum 6 karaktera</li>
                  </ul>
                </ng-template>
              </p-password>
              <label for="newPassword">Nova lozinka</label>
              <small class="text-danger"
                *ngIf="form.controls['newPassword'].dirty && form.controls['newPassword'].hasError('passwordStrength')">
                *Lozinka mora imati minimum 6 karaktera, jedno veliko slovo, jedno malo slovo i jedan broj.
              </small>
            </span>
          </div>
        </div>
        <div class="row">
          <div class="flex flex-column">
            <span class="p-float-label">
              <p-password formControlName="repeatedNewPassword" id="repeatedNewPassword" [toggleMask]="true"
                [feedback]="false" placeholder="Unesite ponovo novu lozinku"></p-password>
              <label for="repeatedNewPassword">Ponovljena lozinka</label>
            </span>
          </div>
        </div>
      </form>
      <hr>
    </ng-template>
    <ng-template pTemplate="footer">
      <p-button label="Potvrdi novu lozinku" [loading]="loadingResetPass" (click)="potvrdi()" icon="pi pi-unlock"
        styleClass="p-button-rounded"></p-button>
      <div class="row mt-3">
        <p><a routerLink="/login">
            Ulogujte se
          </a>
        </p>
      </div>
    </ng-template>
  </p-card>
</div>
