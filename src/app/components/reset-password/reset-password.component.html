<div class="row">
  <p-card>
    <ng-template pTemplate="header">
      <img alt="Globos osiguranje" src="https://globos.rs/images/logo_194x58.svg" height="48px" />
      <img src="/assets/images/GlobosMedicIseceno.png" alt="GlobosMedic" height="26px" class="logoMedic">
    </ng-template>
    <ng-template pTemplate="body">
      <h2 class="p-card-title">Promena lozinke</h2>
      <hr style="margin: 0 0 1.5rem 0;">

      <!-- loading - ceka se validate-reset-token odgovor -->
      <div class="gm-reset-state" *ngIf="tokenState === 'loading'">
        <i class="pi pi-spin pi-spinner"></i>
        <p>Provera linka za promenu lozinke...</p>
      </div>

      <!-- invalid - forma za novu lozinku se NE prikazuje -->
      <div class="gm-reset-state gm-reset-state-invalid" *ngIf="tokenState === 'invalid'">
        <i class="pi pi-exclamation-circle"></i>
        <p>Link za promenu lozinke nije validan ili je istekao.</p>
      </div>

      <form [formGroup]="form" *ngIf="tokenState === 'valid'">
        <div class="row">
          <div class="flex flex-column">
            <span class="p-float-label">
              <p-password formControlName="newPassword" id="newPassword" [toggleMask]="true" (keyup.enter)="potvrdi()"
                [promptLabel]="'Veoma slaba'" [weakLabel]="'Slaba'" [mediumLabel]="'Srednja'" [strongLabel]="'Jaka'"
                placeholder="Unesite novu lozinku">
                <ng-template pTemplate="footer">
                  <p-divider></p-divider>
                  <p class="mt-2">Sugestije</p>
                  <ul class="pl-2 ml-2 mt-0" style="line-height: 1.5">
                    <li>{{passwordPolicyHint}}</li>
                  </ul>
                </ng-template>
              </p-password>
              <label for="newPassword">Nova lozinka</label>
              <small class="text-danger"
                *ngIf="form.controls['newPassword'].dirty && form.controls['newPassword'].hasError('passwordStrength')">
                *{{passwordPolicyHint}}
              </small>
            </span>
          </div>
        </div>
        <div class="row">
          <div class="flex flex-column">
            <span class="p-float-label">
              <p-password formControlName="repeatedNewPassword" id="repeatedNewPassword" [toggleMask]="true"
                [feedback]="false" placeholder="Unesite ponovo novu lozinku"></p-password>
              <label for="repeatedNewPassword">Ponovljena lozinka</label>
            </span>
          </div>
        </div>
      </form>
      <hr>
    </ng-template>
    <ng-template pTemplate="footer">
      <p-button *ngIf="tokenState === 'valid'" label="Potvrdi novu lozinku" [loading]="loadingResetPass"
        (click)="potvrdi()" icon="pi pi-unlock" styleClass="p-button-rounded"></p-button>
      <p-button *ngIf="tokenState === 'invalid'" label="Nazad na prijavu" (click)="noviZahtev()" icon="pi pi-sign-in"
        styleClass="p-button-rounded"></p-button>
      <div class="row mt-3" *ngIf="tokenState === 'valid'">
        <p><a routerLink="/login">
            Ulogujte se
          </a>
        </p>
      </div>
    </ng-template>
  </p-card>
</div>
